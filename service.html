<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Demande de service - BRANSERV</title>
<link rel="stylesheet" href="style.css">

<style>
body{
  background:#f4f5f7;
}

.form-container{
  max-width:700px;
  margin:30px auto;
  padding:20px;
}

.form-card{
  background:white;
  padding:25px;
  border-radius:20px;
  box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.form-card h1{
  margin-top:0;
}

.form-group{
  margin-bottom:16px;
}

.form-group label{
  display:block;
  font-weight:bold;
  margin-bottom:7px;
}

.form-group input,
.form-group textarea,
.form-group select{
  width:100%;
  padding:14px;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:16px;
}

.form-group textarea{
  min-height:130px;
  resize:vertical;
}

.submit{
  width:100%;
  padding:16px;
  border:0;
  border-radius:12px;
  background:#ffd400;
  font-weight:bold;
  font-size:17px;
}
</style>
</head>

<body>

<header>
  <h1 style="color:#ffd400;text-align:center">
    BRANSERV
  </h1>

  <nav style="display:flex;justify-content:center;gap:20px;flex-wrap:wrap;padding:15px">
    <a href="index.html">Accueil</a>
    <a href="services.html">Services</a>
    <a href="produits.html">Produits</a>
  </nav>
</header>

<main class="form-container">

  <div class="form-card">

    <h1 id="title">
      Demande de service
    </h1>

    <p>
      Remplissez le formulaire. BRANSERV
      vous contactera pour confirmer votre demande.
    </p>

    <form id="serviceForm">

      <div class="form-group">
        <label>Nom complet *</label>
        <input id="name" required>
      </div>

      <div class="form-group">
        <label>Téléphone / WhatsApp *</label>
        <input id="phone" type="tel" required>
      </div>

      <div class="form-group">
        <label>Ville *</label>
        <select id="city" required>
  <option value="">Sélectionner une ville</option>
</select>
      </div>

      <div class="form-group">
        <label>Quartier / localisation</label>
        <input id="location">
      </div>

      <div class="form-group" id="extraGroup">

        <label>Détails de la demande *</label>

        <textarea
          id="details"
          required
          placeholder="Décrivez votre besoin..."
        ></textarea>

      </div>

      <div class="form-group">

        <label>Date souhaitée</label>

        <input
          id="date"
          type="date"
        >

      </div>

      <button class="submit">
        📩 Envoyer la demande
      </button>

    </form>

  </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="supabase-client.js"></script>
<script src="branserv-cities.js"></script>

<script>
const SUPABASE_URL =
  "https://lsaykyehbfgfpoqwsmto.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_nuAzQtyhEtTeQoC-4JjM3g_yGG7KHdZ";

const branservSupabase =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

const params =
  new URLSearchParams(location.search);

const type =
  params.get("type") || "other";

const titles = {

  "repair-phone":
    "🔧 Réparation téléphone",

  "repair-computer":
    "💻 Réparation ordinateur",

  "supplement":
    "💊 Conseil complément alimentaire",

  "cosmetic":
    "💄 Conseil cosmétique",

  "design":
    "🎨 Demande d'infographie",

  "it":
    "💻 Service informatique",

  "other":
    "🛠️ Demande de service"

};

document.getElementById("title").textContent =
  titles[type] || titles.other;


document
  .getElementById("serviceForm")
  .addEventListener("submit", async function(e) {

    e.preventDefault();

    const button =
      this.querySelector("button[type='submit'], .submit");

    if (button) {
      button.disabled = true;
      button.textContent = "⏳ Envoi en cours...";
    }

    try {

      const name =
        document.getElementById("name").value.trim();

      const phone =
        document.getElementById("phone").value.trim();

      const city =
        document.getElementById("city").value.trim();

      const location =
        document.getElementById("location").value.trim();

      const details =
        document.getElementById("details").value.trim();

      const date =
        document.getElementById("date").value;

      if (!name || !phone || !city || !details) {
        throw new Error(
          "Veuillez remplir tous les champs obligatoires."
        );
      }

      const service =
        titles[type] || titles.other;

      const locationComplete =
        [city, location]
          .filter(Boolean)
          .join(" - ");

      const { data, error } =
        await branservSupabase
          .from("service_requests")
          .insert({
            service_type: service,
            customer_name: name,
            customer_phone: phone,
            description:
              details +
              (date
                ? "\n\nDate souhaitée : " + date
                : ""),
            location: locationComplete,
            city: city || null,
            status: "new"
          })
          .select()
          .single();

      if (error) {
        console.error(
          "❌ Supabase service_requests :",
          error
        );

        throw new Error(
          error.message ||
          "Impossible d'enregistrer la demande."
        );
      }

      console.log(
        "✅ Demande service enregistrée :",
        data
      );

      const requestId =
        data?.id || Date.now();

      const localRequest = {
        id: "SRV-" + requestId,
        type: type,
        service: service,
        name: name,
        phone: phone,
        city: city,
        location: location,
        details: details,
        date: date,
        status: "new",
        createdAt:
          new Date().toISOString()
      };

      const requests =
        JSON.parse(
          localStorage.getItem(
            "branserv_service_requests"
          ) || "[]"
        );

      requests.unshift(localRequest);

      localStorage.setItem(
        "branserv_service_requests",
        JSON.stringify(requests)
      );

      const message =
`Bonjour BRANSERV,

Je souhaite demander un service.

Service : ${service}
Nom : ${name}
Téléphone : ${phone}
Ville : ${city}
Localisation : ${location || "Non précisée"}

Détails :
${details}

Date souhaitée :
${date || "À définir"}

Référence :
SRV-${requestId}`;

      const whatsapp =
        "https://wa.me/237651715307?text=" +
        encodeURIComponent(message);

      alert(
        "✅ Demande envoyée avec succès !\n\n" +
        "Votre demande a été enregistrée chez BRANSERV.\n\n" +
        "Vous allez être redirigé vers WhatsApp."
      );

      window.location.href = whatsapp;

    } catch (error) {

      console.error(
        "❌ Envoi demande service :",
        error
      );

      alert(
        "❌ La demande n'a pas pu être envoyée.\n\n" +
        error.message
      );

      if (button) {
        button.disabled = false;
        button.textContent =
          "📩 Envoyer la demande";
      }
    }

  });
</script>
<script src="theme-v4.js?v=5.0"></script>
<script src="theme-button-v4.js?v=6.0"></script>
</body>
</html>
