<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photos produits - BRANSERV</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f5f5f5;
  color:#111;
}

header{
  background:#111;
  color:#ffd21c;
  padding:20px;
  text-align:center;
}

header h1{
  margin:0;
  font-size:26px;
}

header p{
  color:#fff;
  margin:8px 0 0;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:20px;
}

.info{
  background:#fff8d6;
  border-left:5px solid #ffd21c;
  padding:15px;
  border-radius:10px;
  margin-bottom:20px;
}

.products{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:20px;
}

.card{
  background:white;
  border-radius:16px;
  padding:15px;
  box-shadow:0 4px 15px rgba(0,0,0,.08);
}

.card h2{
  font-size:19px;
  margin:5px 0;
}

.price{
  font-weight:bold;
  margin:5px 0 12px;
}

.preview{
  width:100%;
  height:220px;
  object-fit:cover;
  border-radius:12px;
  background:#eee;
  display:block;
  margin-bottom:12px;
}

.no-photo{
  height:220px;
  border-radius:12px;
  background:#eee;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:50px;
  margin-bottom:12px;
}

input[type=file]{
  width:100%;
  padding:12px;
  border:2px dashed #ccc;
  border-radius:10px;
  background:#fafafa;
}

button{
  width:100%;
  margin-top:12px;
  padding:13px;
  border:0;
  border-radius:10px;
  background:#111;
  color:#ffd21c;
  font-weight:bold;
  font-size:15px;
}

button:disabled{
  opacity:.5;
}

.status{
  margin-top:10px;
  font-size:14px;
  font-weight:bold;
}

.success{
  color:green;
}

.error{
  color:red;
}

.back{
  display:inline-block;
  margin-top:20px;
  padding:12px 18px;
  background:#111;
  color:#ffd21c;
  text-decoration:none;
  border-radius:10px;
}
</style>
</head>

<body>

<header>
  <h1>📸 Photos des produits</h1>
  <p>BRANSERV — Ajouter les vraies photos depuis la galerie</p>
</header>

<div class="container">

  <div class="info">
    <strong>Important :</strong><br>
    Choisis une vraie photo depuis la galerie de ton téléphone.
    La photo sera automatiquement réduite et enregistrée dans BRANSERV.
    <br><br>
    <strong>Firebase n'est pas utilisé.</strong>
  </div>

  <div id="products" class="products"></div>

  <a class="back" href="admin.html">← Retour à l'administration</a>

</div>

<script>

const STORAGE_KEY = "branserv_products";

function getProducts(){
  try{
    return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
  }catch(e){
    console.error(e);
    return [];
  }
}

function saveProducts(products){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(products));
}

function money(value){
  return Number(value || 0).toLocaleString("fr-FR") + " FCFA";
}

function compressImage(file){

  return new Promise((resolve,reject)=>{

    const reader = new FileReader();

    reader.onload = function(e){

      const img = new Image();

      img.onload = function(){

        const MAX = 800;

        let width = img.width;
        let height = img.height;

        if(width > height){

          if(width > MAX){
            height = Math.round(height * MAX / width);
            width = MAX;
          }

        }else{

          if(height > MAX){
            width = Math.round(width * MAX / height);
            height = MAX;
          }

        }

        const canvas = document.createElement("canvas");

        canvas.width = width;
        canvas.height = height;

        const ctx = canvas.getContext("2d");

        ctx.drawImage(img,0,0,width,height);

        const result = canvas.toDataURL(
          "image/jpeg",
          0.72
        );

        resolve(result);

      };

      img.onerror = reject;

      img.src = e.target.result;

    };

    reader.onerror = reject;

    reader.readAsDataURL(file);

  });

}

function render(){

  const box = document.getElementById("products");

  const products = getProducts();

  if(!products.length){

    box.innerHTML = `
      <div class="card">
        <h2>Aucun produit trouvé</h2>
        <p>Vérifie que tes produits sont bien présents dans BRANSERV.</p>
      </div>
    `;

    return;
  }

  box.innerHTML = products.map((p,index)=>{

    const hasImage =
      typeof p.image === "string" &&
      p.image.startsWith("data:image/");

    return `

      <div class="card">

        <h2>${escapeHtml(p.name)}</h2>

        <div class="price">
          ${money(p.price)}
        </div>

        ${
          hasImage
          ?
          `<img
            id="preview-${p.id}"
            class="preview"
            src="${p.image}"
            alt="${escapeHtml(p.name)}"
          >`
          :
          `<div
            id="preview-${p.id}"
            class="no-photo"
          >
            📷
          </div>`
        }

        <input
          type="file"
          id="file-${p.id}"
          accept="image/*"
          onchange="previewPhoto(${p.id}, this)"
        >

        <button
          id="btn-${p.id}"
          onclick="savePhoto(${p.id})"
        >
          💾 Enregistrer la photo
        </button>

        <div
          id="status-${p.id}"
          class="status"
        ></div>

      </div>

    `;

  }).join("");

}

function escapeHtml(text){

  return String(text || "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

const pendingPhotos = {};

async function previewPhoto(id,input){

  const file = input.files[0];

  if(!file) return;

  const status =
    document.getElementById("status-"+id);

  status.className = "status";
  status.textContent = "⏳ Préparation de la photo...";

  try{

    if(!file.type.startsWith("image/")){

      throw new Error("Le fichier sélectionné n'est pas une image.");

    }

    const compressed =
      await compressImage(file);

    pendingPhotos[id] = compressed;

    const preview =
      document.getElementById("preview-"+id);

    if(preview.tagName === "IMG"){

      preview.src = compressed;

    }else{

      const img =
        document.createElement("img");

      img.id = "preview-"+id;
      img.className = "preview";
      img.src = compressed;

      preview.replaceWith(img);

    }

    status.className = "status";
    status.textContent =
      "✅ Photo prête. Clique sur « Enregistrer la photo ».";

  }catch(error){

    console.error(error);

    status.className = "status error";
    status.textContent =
      "❌ Impossible de traiter cette photo.";

  }

}

function savePhoto(id){

  const photo = pendingPhotos[id];

  const status =
    document.getElementById("status-"+id);

  if(!photo){

    status.className = "status error";

    status.textContent =
      "⚠️ Choisis d'abord une photo.";

    return;

  }

  const products = getProducts();

  const product =
    products.find(p => String(p.id) === String(id));

  if(!product){

    status.className = "status error";

    status.textContent =
      "❌ Produit introuvable.";

    return;

  }

  product.image = photo;

  saveProducts(products);

  delete pendingPhotos[id];

  status.className = "status success";

  status.textContent =
    "✅ Photo enregistrée avec succès.";

}

render();

</script>

</body>
</html>
