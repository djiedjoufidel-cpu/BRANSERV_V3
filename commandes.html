<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Commandes - BRANSERV ADMIN</title>

<link rel="stylesheet" href="style.css">

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f4f5f7;
  color:#111;
}

header{
  background:#111;
  color:white;
  padding:22px 15px;
  text-align:center;
}

header h1{
  margin:0 0 20px;
  color:#ffd400;
  font-size:28px;
}

nav{
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:25px;
}

nav a{
  color:white;
  text-decoration:none;
  font-weight:bold;
  font-size:17px;
}

.page{
  max-width:1000px;
  margin:auto;
  padding:25px 16px 50px;
}

.page-title{
  font-size:38px;
  margin:15px 0 25px;
}

.search{
  width:100%;
  padding:17px;
  border:1px solid #ddd;
  border-radius:14px;
  font-size:17px;
  margin-bottom:25px;
}

.filters{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:25px;
}

.filters button{
  border:0;
  border-radius:10px;
  padding:11px 14px;
  font-weight:bold;
  background:white;
  cursor:pointer;
}

.filters button.active{
  background:#ffd400;
}

#ordersList{
  display:grid;
  gap:20px;
}

.order-card{
  background:white;
  border-radius:18px;
  padding:20px;
  box-shadow:0 4px 18px rgba(0,0,0,.08);
}

.order-header{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:15px;
  border-bottom:1px solid #eee;
  padding-bottom:15px;
}

.order-number{
  font-size:20px;
  font-weight:bold;
}

.order-date{
  color:#777;
  margin-top:5px;
  font-size:14px;
}

.status{
  padding:8px 12px;
  border-radius:20px;
  font-weight:bold;
  font-size:13px;
  white-space:nowrap;
}

.new{background:#fff3cd;color:#856404}
.confirmed{background:#dbeafe;color:#1d4ed8}
.sold{background:#dcfce7;color:#166534}
.rejected{background:#fee2e2;color:#991b1b}
.abandoned{background:#e5e7eb;color:#374151}
.returned{background:#fef3c7;color:#92400e}

.customer{
  background:#f7f7f7;
  border-radius:12px;
  padding:15px;
  margin-top:15px;
}

.customer h3,
.products h3{
  margin-top:0;
}

.product-line{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:10px 0;
  border-bottom:1px solid #eee;
}

.total{
  display:flex;
  justify-content:space-between;
  font-size:21px;
  font-weight:bold;
  padding:18px 0;
}

.actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.actions button,
.actions a{
  border:0;
  border-radius:11px;
  padding:13px 15px;
  text-decoration:none;
  font-weight:bold;
  cursor:pointer;
  font-size:14px;
}

.btn-confirm{
  background:#ffd400;
  color:#111;
}

.btn-sell{
  background:#16a34a;
  color:white;
}

.btn-reject{
  background:#dc2626;
  color:white;
}

.btn-return{
  background:#f59e0b;
  color:white;
}

.btn-invoice{
  background:#111;
  color:white;
}

.empty{
  background:white;
  border-radius:18px;
  padding:45px 20px;
  text-align:center;
  color:#777;
}

.empty strong{
  display:block;
  color:#111;
  font-size:22px;
  margin-bottom:8px;
}

.new-alert{
  background:#fff7cc;
  border:2px solid #ffd400;
  border-radius:14px;
  padding:15px;
  margin-bottom:20px;
  font-weight:bold;
}

@media(max-width:600px){

  .page{
    padding:18px 12px 40px;
  }

  .page-title{
    font-size:31px;
  }

  .order-header{
    flex-direction:column;
  }

  .status{
    align-self:flex-start;
  }

  .product-line{
    font-size:14px;
  }

  .total{
    font-size:18px;
  }

  .actions button,
  .actions a{
    width:100%;
    text-align:center;
  }
}
</style>
</head>

<body>

<header>
  <h1>BRANSERV ADMIN</h1>

  <nav>
    <a href="admin.html">Dashboard</a>
    <a href="commandes.html">Commandes</a>
    <a href="ventes.html">Ventes</a>
    <a href="index.html">Boutique</a>
  </nav>
</header>

<main class="page">

  <h2 class="page-title">📦 Commandes</h2>

  <div id="newAlert"></div>

  <input
    id="search"
    class="search"
    type="search"
    placeholder="Rechercher numéro, client ou téléphone..."
  >

  <div class="filters">
    <button class="active" onclick="setFilter('all',this)">Toutes</button>
    <button onclick="setFilter('new',this)">🟡 Nouvelles</button>
    <button onclick="setFilter('confirmed',this)">🔵 Confirmées</button>
    <button onclick="setFilter('sold',this)">🟢 Vendues</button>
    <button onclick="setFilter('returned',this)">↩️ Retournées</button>
    <button onclick="setFilter('rejected',this)">🔴 Rejetées</button>
  </div>

  <div id="ordersList"></div>

</main>




<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="supabase-client.js"></script>
<script src="commandes.js?v=20260928"></script>

</body>
</html>
