<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Commande - BRANSERV</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.json">
</head>
<body>

<header>
<a class="logo" href="index.html">BRANSERV</a>
<nav>
<a href="index.html">Accueil</a>
<a href="produits.html">Produits</a>
<a href="panier.html">Panier</a>
<a href="admin.html">Admin</a>
</nav>
</header>

<main class="section">

<div class="form-card">
<h1>Finaliser ma commande</h1>

<input id="customerName" placeholder="Nom complet">
<input id="customerPhone" placeholder="Numéro de téléphone">

<label for="requestedDate">Date souhaitée</label>
<input type="date" id="requestedDate" required>

<label for="requestedTime">Heure souhaitée</label>
<input type="time" id="requestedTime" required>

<select id="delivery">
<option value="delivery">Livraison</option>
<option value="pickup">Retrait sur place</option>
</select>

<select id="city" required>
  <option value="">Sélectionner une ville</option>
</select>
<input id="district" placeholder="Quartier">
<input id="address" placeholder="Adresse / lieu de livraison">

<textarea id="comment"
placeholder="Commentaire ou précision"></textarea>

<div id="orderSummary"></div>

<button class="btn whatsapp"
onclick="submitOrder()">
Envoyer la commande sur WhatsApp
</button>

</div>

</main>

<footer>
<h2>BRANSERV</h2>
</footer>

<script src="app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="supabase-client.js"></script>
<script src="branserv-cities.js"></script>
<script src="commande.js"></script>
<script src="theme-v4.js?v=5.0"></script>
<script src="theme-button-v4.js?v=6.0"></script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./service-worker.js')
      .then(reg => console.log('✅ BRANSERV PWA activée', reg.scope))
      .catch(err => console.error('❌ Service Worker BRANSERV :', err));
  });
}
</script>

</body>
</html>
