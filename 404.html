<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Page introuvable — ETS H-PROMESSE</title>
  <meta name="description" content="La page que vous recherchez n'existe pas ou a été déplacée. Retournez sur le site ETS H-PROMESSE.">
  <meta name="theme-color" content="#087f8c">
  <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: Arial, Helvetica, sans-serif;
      background: #FAFAFF;
      color: #171521;
    }

    header {
      background: #171521;
      border-bottom: 3px solid #087f8c;
      padding: 20px;
    }

    header a {
      color: #087f8c;
      text-decoration: none;
      font-size: 24px;
      font-weight: 900;
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
    }

    .error {
      max-width: 600px;
    }

    .code {
      font-size: clamp(80px, 20vw, 150px);
      font-weight: 900;
      color: #087f8c;
      line-height: 1;
      margin-bottom: 20px;
    }

    h1 {
      font-size: clamp(24px, 5vw, 36px);
      margin-bottom: 15px;
    }

    p {
      color: #555;
      margin-bottom: 30px;
      line-height: 1.6;
    }

    .button {
      display: inline-block;
      background: #087f8c;
      color: white;
      padding: 14px 24px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      transition: background .2s;
    }

    .button:hover {
      background: #075f69;
    }

    footer {
      background: #075f69;
      color: white;
      text-align: center;
      padding: 20px;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <header>
    <a href="/">ETS H-PROMESSE</a>
  </header>

  <main>
    <div class="error">
      <div class="code">404</div>

      <h1>Oups ! Page introuvable</h1>

      <p>
        La page que vous recherchez n'existe pas,
        a été déplacée ou son adresse est incorrecte.
      </p>

      <a class="button" href="/">Retour à l'accueil</a>
    </div>
  </main>

  <footer>
    © 2026 ETS H-PROMESSE — Yaoundé, Cameroun
  </footer>
</body>
</html>
