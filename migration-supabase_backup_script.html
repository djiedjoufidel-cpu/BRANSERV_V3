<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Migration BRANSERV → Supabase</title>
<style>
body{
  font-family:Arial,sans-serif;
  background:#f5f5f5;
  padding:20px;
}
.card{
  max-width:700px;
  margin:auto;
  background:white;
  padding:25px;
  border-radius:18px;
}
button{
  padding:14px 20px;
  border:0;
  border-radius:10px;
  background:#111;
  color:white;
  font-weight:bold;
}
#log{
  margin-top:20px;
  white-space:pre-wrap;
  background:#111;
  color:#0f0;
  padding:15px;
  border-radius:10px;
}
</style>
</head>

<body>

<div class="card">

<h1>🚀 BRANSERV → Supabase</h1>

<p>
Cette page va uniquement <b>lire</b> tes produits LocalStorage.
Elle ne supprimera aucune donnée locale.
</p>

<button onclick="analyser()">Analyser mes produits</button>
<button id="btnVerifierImages" onclick="verifierImages()" type="button">
🖼️ Vérifier les images
</button>

<div id="log">En attente...</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">


function escapeHtml(value) {
  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function escapeAttribute(value) {
  return escapeHtml(value);
}



function verifierImages() {
    try {
        const produits = JSON.parse(
            localStorage.getItem("branserv_products") || "[]"
        );

        let resultat = "🖼️ VÉRIFICATION DES IMAGES\n\n";

        if (!produits.length) {
            resultat += "❌ Aucun produit trouvé.";
        } else {
            produits.forEach((p, i) => {
                const image = String(p.image || "").trim();

                let type = "🟠 FORMAT INCONNU";

                if (!image) {
                    type = "🔴 AUCUNE IMAGE";
                } else if (image.startsWith("data:image/")) {
                    type = "🟢 IMAGE LOCALE";
                } else if (
                    image.startsWith("http://") ||
                    image.startsWith("https://")
                ) {
                    type = "🔵 URL";
                } else if (image.startsWith("blob:")) {
                    type = "🟠 IMAGE TEMPORAIRE";
                }

                resultat +=
                    "#" + (i + 1) + " — " +
                    (p.name || "Sans nom") +
                    "\n" +
                    type +
                    "\n\n";
            });
        }

        // Affichage directement dans la page
        const log = document.getElementById("log");

        if (log) {
            log.style.display = "block";
            log.style.whiteSpace = "pre-wrap";
            log.style.padding = "20px";
            log.style.marginTop = "20px";
            log.style.background = "#111";
            log.style.color = "#fff";
            log.style.borderRadius = "12px";
            log.style.fontSize = "16px";
            log.textContent = resultat;
        }

        // Également dans une fenêtre pour être certain de voir le résultat
        alert(resultat);

    } catch (error) {
        alert("❌ ERREUR : " + error.message);

        const log = document.getElementById("log");

        if (log) {
            log.textContent =
                "❌ Erreur pendant la vérification :\n" +
                error.message;
        }

        console.error(error);
    }
}


</script>

<script>
const SUPABASE_URL =
"https://lsaykyehbfgfpoqwsmto.supabase.co";

const SUPABASE_KEY =
"sb_publishable_nuAzQtyhEtTeQoC-4JjM3g_yGG7KHdZ";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

function log(text){
  document.getElementById("log").textContent +=
  "\n" + text;
}

function analyser(){

  document.getElementById("log").textContent="";

  const raw =
    localStorage.getItem("branserv_products");

  if(!raw){

    log("❌ Aucun branserv_products trouvé.");

    return;
  }

  let products;

  try{
    products=JSON.parse(raw);
  }catch(e){

    log("❌ Données produits invalides.");

    return;
  }

  log("✅ LocalStorage trouvé.");
  log("📦 Nombre de produits : "+products.length);
  log("");

  products.forEach((p,i)=>{

    log(
`#${i+1}
ID local : ${p.id}
Nom : ${p.name}
Catégorie : ${p.category}
Prix : ${p.price}
Prix achat : ${p.purchasePrice||0}
Ancien prix : ${p.oldPrice||0}
Stock : ${p.stock||0}
Promotion : ${p.promo ? "Oui":"Non"}
Actif : ${p.active !== false ? "Oui":"Non"}
Image : ${p.image ? "Présente":"Aucune"}
-------------------------`
    );

  });

  log("");
  log("🟢 ANALYSE TERMINÉE.");
  log("Aucune donnée n'a été modifiée.");
}



function escapeHtml(value) {
  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function escapeAttribute(value) {
  return escapeHtml(value);
}

</script>

</body>
</html>
