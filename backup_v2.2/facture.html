<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Facture BRANSERV</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#f3f4f6;
  font-family:Arial,sans-serif;
  color:#111827;
}
.page{
  max-width:800px;
  margin:25px auto;
  background:white;
  padding:35px;
  border-radius:12px;
  box-shadow:0 4px 20px rgba(0,0,0,.08);
}
.header{
  display:flex;
  justify-content:space-between;
  gap:20px;
  border-bottom:2px solid #111827;
  padding-bottom:20px;
  margin-bottom:25px;
}
.logo{
  font-size:28px;
  font-weight:800;
}
.small{
  color:#6b7280;
  font-size:13px;
  line-height:1.6;
}
h1{
  margin:0 0 5px;
  font-size:24px;
}
.info{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
  margin-bottom:25px;
}
.box{
  border:1px solid #e5e7eb;
  border-radius:8px;
  padding:15px;
}
table{
  width:100%;
  border-collapse:collapse;
  margin-top:20px;
}
th,td{
  padding:12px 8px;
  border-bottom:1px solid #e5e7eb;
  text-align:left;
}
th{
  background:#f9fafb;
}
.num{text-align:right}
.total{
  margin-top:20px;
  margin-left:auto;
  max-width:320px;
}
.total-row{
  display:flex;
  justify-content:space-between;
  padding:8px 0;
}
.grand{
  font-size:20px;
  font-weight:800;
  border-top:2px solid #111827;
  padding-top:12px;
}
.actions{
  max-width:800px;
  margin:15px auto 30px;
  display:flex;
  gap:10px;
}
button{
  border:0;
  padding:14px 20px;
  border-radius:8px;
  font-weight:700;
  cursor:pointer;
  font-size:15px;
}
.pdf{
  background:#111827;
  color:white;
  flex:1;
}
.back{
  background:#e5e7eb;
  color:#111827;
}
button:disabled{
  opacity:.6;
  cursor:wait;
}

@media(max-width:600px){
  .page{
    margin:0;
    border-radius:0;
    padding:20px 15px;
  }
  .header,.info{
    grid-template-columns:1fr;
    display:block;
  }
  .header>div{
    margin-bottom:15px;
  }
  table{
    font-size:12px;
  }
  th,td{
    padding:8px 4px;
  }
  .actions{
    padding:10px 15px;
  }
}
</style>

<!-- Vrai moteur PDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>

<body>

<div class="page" id="facture">

  <div class="header">
    <div>
      <div class="logo">BRANSERV</div>
      <div class="small">
        Boutique en ligne<br>
        Yaoundé, Cameroun<br>
        WhatsApp : +237 651 715 307<br>
        Email : djiedjoufidel@gmail.com
      </div>
    </div>

    <div style="text-align:right">
      <h1>FACTURE</h1>
      <div class="small" id="invoiceNumber">—</div>
      <div class="small" id="invoiceDate">—</div>
    </div>
  </div>

  <div class="info">

    <div class="box">
      <strong>Client</strong>
      <div id="clientInfo" class="small"></div>
    </div>

    <div class="box">
      <strong>Livraison</strong>
      <div id="deliveryInfo" class="small"></div>
    </div>

  </div>

  <table>
    <thead>
      <tr>
        <th>Produit</th>
        <th class="num">Qté</th>
        <th class="num">Prix</th>
        <th class="num">Total</th>
      </tr>
    </thead>

    <tbody id="items"></tbody>
  </table>

  <div class="total">

    <div class="total-row">
      <span>Sous-total</span>
      <strong id="subtotal">0 FCFA</strong>
    </div>

    <div class="total-row">
      <span>Livraison</span>
      <strong id="deliveryFee">0 FCFA</strong>
    </div>

    <div class="total-row grand">
      <span>TOTAL</span>
      <strong id="total">0 FCFA</strong>
    </div>

  </div>

  <div style="margin-top:35px;text-align:center" class="small">
    Merci pour votre confiance.<br>
    Cette facture a été générée par BRANSERV.
  </div>

</div>

<div class="actions">

  <button class="back" onclick="history.back()">
    ← Retour
  </button>

  <button class="pdf" id="pdfButton" onclick="downloadInvoice()">
    📄 Télécharger la facture PDF
  </button>

</div>

<script src="app.js"></script>
<script src="facture.js"></script>

</body>
</html>
